<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0c0705">
  <meta name="description" content="Menú de día y menú de noche de Arepas Monik.">
  <title>Menú · Arepas Monik</title>
  <link rel="icon" href="logo-monik.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="menu.css">
</head>
<body data-menu="dia">

  <div class="bg-glow" aria-hidden="true"></div>

  <!-- ===== Cabecera ===== -->
  <header class="hero">
    <img class="hero-logo" src="logo-monik.png" alt="Arepas Monik" width="520" height="449">
    <p class="hero-kicker"><span></span>Bienvenidos<span></span></p>
  </header>

  <!-- ===== Buscador ===== -->
  <div class="searchbar">
    <label class="search" for="q">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar: pollo, café, huevos…" autocomplete="off" enterkeyhint="search" aria-label="Buscar en el menú">
      <button class="search-clear" id="qClear" type="button" aria-label="Borrar búsqueda" hidden>✕</button>
    </label>
  </div>

  <!-- ===== Pestañas + categorías (se quedan fijas al hacer scroll) ===== -->
  <div class="sticky" id="sticky">
    <div class="tabs" id="tabs" role="tablist" aria-label="Elegir menú" data-active="0">
      <span class="tabs-pill" aria-hidden="true"></span>
      <button class="tab" id="tab-dia" role="tab" type="button" data-menu="dia" aria-selected="true" aria-controls="panel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.3M12 19.2v2.3M2.5 12h2.3M19.2 12h2.3M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>
        Menú día
      </button>
      <button class="tab" id="tab-noche" role="tab" type="button" data-menu="noche" aria-selected="false" aria-controls="panel" tabindex="-1">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/></svg>
        Menú noche
      </button>
    </div>
    <nav class="chips" id="chips" aria-label="Categorías del menú"></nav>
  </div>

  <!-- ===== Contenido ===== -->
  <main class="wrap">
    <div class="menu-head">
      <h2 class="script-title" id="menuTitle">Menú día</h2>
      <div class="swoosh" aria-hidden="true"></div>
      <p class="menu-note" id="menuNote" aria-live="polite"></p>
    </div>

    <div class="cross-hint" id="crossHint" hidden></div>

    <section id="panel" class="cols" role="tabpanel" aria-live="polite" tabindex="-1"></section>

    <div class="empty" id="empty" hidden>
      <div class="empty-icon" aria-hidden="true">🫓</div>
      <p class="empty-title">No encontramos “<span id="emptyQ"></span>”</p>
      <p class="empty-sub">Prueba con otra palabra, por ejemplo <em>pollo</em>, <em>queso</em> o <em>café</em>.</p>
      <button class="btn" id="emptyClear" type="button">Ver todo el menú</button>
    </div>

    <noscript><p class="empty-sub" style="text-align:center;padding:40px 0">Activa JavaScript para ver el menú.</p></noscript>
  </main>

  <footer class="foot">
    <img src="logo-monik.png" alt="" width="120" height="104">
    <p>Arepas Monik</p>
  </footer>

  <button class="to-top" id="toTop" type="button" aria-label="Volver arriba" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 14 6-6 6 6"/></svg>
  </button>

  <script src="menu.js"></script>
</body>
</html>
