  <button type="button" class="skip" id="saltar">Saltar intro →</button>

  <script>
    var DESTINO = "menu.html";
    var TOTAL = 6500;

    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      TOTAL = 1500;
    }

    var yaSalio = false;

    // Centra el zoom de salida en el medio de la pantalla (no depende de transformaciones)
    var logoWrap = document.querySelector(".logo-zoom-wrapper");
    function centrarZoom() {
      var centroLogo = logoWrap.offsetTop + logoWrap.offsetHeight / 2;
      logoWrap.style.setProperty("--zoom-dy", (window.innerHeight / 2 - centroLogo) + "px");
    }
    centrarZoom();
    window.addEventListener("resize", centrarZoom);
    window.addEventListener("orientationchange", centrarZoom);

    function irAlInicio() {
      if (yaSalio) return;
      yaSalio = true;
      document.body.classList.add("salir");
      setTimeout(function () {
        window.location.replace(DESTINO);
      }, 500);
    }

    setTimeout(irAlInicio, TOTAL);

    document.getElementById("saltar").addEventListener("click", irAlInicio);

    document.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === "Escape") irAlInicio();
    });
  </script>
